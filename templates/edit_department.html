</head>

<body>

<header>
    <h1>Smart Hospital Management System</h1>
    <p>Edit Department Details</p>
</header>

<div class="container">

```
<div class="card">

    <h2>Update Department</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="message">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form
        action="{{ url_for('edit_department', department_id=department['id']) }}"
        method="POST">

        <div class="form-group">
            <label for="department_name">Department Name</label>

            <input
                type="text"
                id="department_name"
                name="department_name"
                value="{{ department['department_name'] }}"
                maxlength="100"
                required>
        </div>

        <div class="form-group">
            <label for="department_head">Department Head</label>

            <input
                type="text"
                id="department_head"
                name="department_head"
                value="{{ department['department_head'] }}"
                maxlength="100"
                required>
        </div>

        <div class="form-group">
            <label for="location">Location</label>

            <input
                type="text"
                id="location"
                name="location"
                value="{{ department['location'] }}"
                maxlength="100"
                required>
        </div>

        <div class="buttons">
            <button type="submit" class="save-btn">
                Save Changes
            </button>

            <a href="{{ url_for('departments') }}" class="cancel-btn">
                Cancel
            </a>
        </div>

    </form>

</div>
```
